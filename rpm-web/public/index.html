<!DOCTYPE html>
<html>
<head>
    <title>RPM Monitor</title>
</head>
<body>

<h1>RPM Atual</h1>

<h2 id="rpm">0</h2>

<script>
async function atualizarRPM() {

    const resposta = await fetch('/rpm');

    const dados = await resposta.json();

    document.getElementById('rpm').innerText = dados.rpm;
}

setInterval(atualizarRPM, 200);

</script>

</body>
</html>
